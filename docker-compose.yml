services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-waddlers}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Throwaway database for integration tests: data lives in RAM only.
  postgres-test:
    image: postgres:17
    profiles: ['test']
    environment:
      POSTGRES_USER: waddlers
      POSTGRES_PASSWORD: waddlers-test
      POSTGRES_DB: waddlers_test
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U waddlers -d waddlers_test']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot, runs as the database OWNER: (re)creates the DML-only application role, then applies
  # committed Drizzle migrations, then exits. `web` waits for it and never gets owner credentials.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    profiles: ['app']
    environment:
      DATABASE_MIGRATE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-waddlers}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  web:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ['app']
    restart: unless-stopped
    # Explicit allow-list: the web container must not see POSTGRES_PASSWORD, the owner URL or
    # any other variable of the root .env.
    environment:
      # Inside the compose network the database host is the service name; app role = DML only.
      DATABASE_URL: postgres://waddlers_app:${APP_DB_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-waddlers}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-fake}
      TRUSTED_PROXY_HEADER: ${TRUSTED_PROXY_HEADER:-}
      # Required by the app (>= 32 bytes); empty here fails fast at the first request.
      AUTH_SECRET: ${AUTH_SECRET:-}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Market-data worker: refreshes quotes every 15 min for held listings during market hours and runs
  # the nightly history/FX/metrics/session-purge job. SINGLE INSTANCE ONLY (D13): its job lock is
  # in-process, so never scale this service above 1 (a second replica would double-fetch and burn
  # the provider quota). Same DML-only database role as `web`; non-root; explicit env allow-list.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    profiles: ['app']
    restart: unless-stopped
    stop_grace_period: 40s
    # Hardening: immutable root filesystem (tsx only needs a scratch /tmp for its transpile
    # cache), no Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgres://waddlers_app:${APP_DB_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-waddlers}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-fake}
      FX_PROVIDER: ${FX_PROVIDER:-ecb}
      EODHD_API_TOKEN: ${EODHD_API_TOKEN:-}
      MARKET_DATA_QUOTE_TTL_MINUTES: ${MARKET_DATA_QUOTE_TTL_MINUTES:-}
      MARKET_DATA_HISTORY_TTL_HOURS: ${MARKET_DATA_HISTORY_TTL_HOURS:-}
      MARKET_DATA_FX_TTL_HOURS: ${MARKET_DATA_FX_TTL_HOURS:-}
      MARKET_DATA_DAILY_QUOTA: ${MARKET_DATA_DAILY_QUOTA:-}
      MARKET_DATA_CONCURRENCY: ${MARKET_DATA_CONCURRENCY:-}
      MARKET_DATA_TIMEOUT_MS: ${MARKET_DATA_TIMEOUT_MS:-}
    deploy:
      replicas: 1
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
